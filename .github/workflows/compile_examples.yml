name: Compile examples
 
on:
  push:
  pull_request:
  workflow_dispatch:
 
jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fqbn: arduino:avr:uno
            platform: arduino:avr
            sketch: examples/multiple-sht-sensors
          - fqbn: arduino:avr:uno
            platform: arduino:avr
            sketch: examples/sht-autodetect
          - fqbn: arduino:avr:uno
            platform: arduino:avr
            sketch: examples/sht3xanalog

         # ESP8266
          - fqbn: esp8266:esp8266:d1_mini
            platform: esp8266:esp8266
            sketch: examples/multiple-sht-sensors
          - fqbn: esp8266:esp8266:d1_mini
            platform: esp8266:esp8266
            sketch: examples/sht-autodetect
          - fqbn: esp8266:esp8266:d1_mini
            platform: esp8266:esp8266
            sketch: examples/sht3xanalog

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
 
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
 
      - name: Configure additional boards manager
        run: |
          arduino-cli config init \
            --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

      - name: Install core
        run: |
          arduino-cli core update-index
          arduino-cli core install ${{ matrix.platform }}
 
      - name: Compile ${{ matrix.sketch }}
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            --warnings all \
            --build-property compiler.c.extra_flags="-Wall -Werror -Wextra" \
            --build-property compiler.cpp.extra_flags="-Wall -Werror -Wextra" \
            ${{ matrix.sketch }}